<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Világ körüli utazás</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#0b3c5d,#0f5a73 55%,#1b7a8c);color:#fff;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(28px,6vw,44px);margin:6px 0 8px;letter-spacing:-.5px}h1 span{color:#ffd23f}
.lema{color:#cfe8ef;font-size:17px;line-height:1.45;margin:0 0 20px}
.btn{display:inline-block;border:0;border-radius:999px;background:linear-gradient(90deg,#ff7a1a,#ff4f2e);color:#fff;font-weight:800;font-size:18px;padding:15px 28px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn.gris{background:#ffffff22;box-shadow:none}.tarjeta .btn.gris{background:#e9edf3;color:#1b2a4a}
.pas{background:#fff;color:#1b2a4a;border-radius:18px;padding:16px;margin:0 0 18px}
.pas h2{margin:0 0 10px;font-size:18px}.sellos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sello{aspect-ratio:1;border-radius:50%;border:2.5px dashed #c8cfdc;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.35}
.sello.ok{opacity:1;border-style:solid;transform:rotate(-8deg)}
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cont{border:0;border-radius:16px;padding:18px 8px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.22)}
.cont b{font-size:38px}.cont small{font-weight:600;opacity:.9}
.tarjeta{background:#fff;color:#1b2a4a;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cat{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.num{float:right;color:#8a93a5;font-size:13px;font-weight:700}
.q{font-size:21px;font-weight:800;line-height:1.3;margin:6px 0 16px}
.ops{display:grid;gap:10px}.op{border:2px solid #e2e6ee;background:#f7f9fc;border-radius:14px;padding:14px;font-size:17px;font-weight:700;text-align:left;cursor:pointer;color:#1b2a4a}
.op.bien{background:#dff6e5;border-color:#2fa84f}.op.mal{background:#fde2e0;border-color:#e0453a}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff6e1;font-size:16px;line-height:1.4;display:none}
.fb b{display:block;margin-bottom:4px}.acc{margin-top:16px;text-align:right}
.res{text-align:center}.res .big{font-size:64px}.oculto{display:none}
@media (max-width:520px){.mapa{grid-template-columns:repeat(2,1fr)}.sellos{grid-template-columns:repeat(6,1fr);gap:5px}.sello{font-size:20px}}
</style></head><body><div class="app" id="app"></div>
<script>
const D={"ui": {"titulo": "Világ körüli utazás", "lema": "Repülj kontinensről kontinensre, válaszolj a kérdésekre, és gyűjts pecséteket az útleveledbe.", "jugar": "Indul az utazás", "pasaporte": "Az útlevelem", "elige": "Válaszd ki a következő úti célodat", "pregunta": "{n}. kérdés / {t}", "correcto": "Helyes!", "incorrecto": "Majdnem. A helyes válasz:", "siguiente": "Tovább", "sello": "Megszerezted a pecsétet!", "sello_falta": "{t} kérdésből {n} helyes válasz kell a pecséthez. Próbáld újra ezt a kontinenst!", "reintentar": "Újra", "volver": "Vissza a térképhez", "puntos": "{n} / {t} helyes", "final_titulo": "Igazi világutazó vagy!", "final_texto": "Mind a 6 pecsétet összegyűjtötted. Megtelt az útleveled: ismered a világot!", "reiniciar": "Új utazás", "categorias": {"capitales": "Országok és fővárosok", "idiomas": "A világ nyelvei", "agua": "Folyók és óceánok", "montes": "Hegységek", "monumentos": "Híres látnivalók", "cultura": "Kultúra és érdekességek"}}, "aprobar": 6, "continentes": [{"id": "europa", "nombre": "Európa", "emoji": "🏰", "color": "#2E6FB7", "preguntas": [{"cat": "capitales", "q": "Mi Olaszország fővárosa?", "ops": ["Milánó", "Róma", "Velence", "Nápoly"], "ok": 1, "dato": "Róma több mint 2000 éve a Római Birodalom központja volt."}, {"cat": "capitales", "q": "Melyik ország fővárosa Madrid?", "ops": ["Portugália", "Mexikó", "Spanyolország", "Argentína"], "ok": 2, "dato": "Madrid Spanyolország közepén fekszik."}, {"cat": "idiomas", "q": "Milyen nyelven beszélnek Ausztriában?", "ops": ["Németül", "Franciául", "Osztrákul", "Olaszul"], "ok": 0, "dato": "Németül beszélnek Németországban, Ausztriában és Svájc egy részén."}, {"cat": "agua", "q": "Melyik hosszú folyó folyik át Bécsen, Budapesten és Belgrádon?", "ops": ["A Rajna", "A Szajna", "A Temze", "A Duna"], "ok": 3, "dato": "A Duna 10 országon folyik át vagy halad el mellettük, mielőtt a Fekete-tengerbe ömlik."}, {"cat": "montes", "q": "Melyik Nyugat-Európa legmagasabb hegysége?", "ops": ["Az Alpok", "A Pireneusok", "A Kárpátok", "Az Urál"], "ok": 0, "dato": "Az Alpokban lévő Mont Blanc kb. 4800 méter magas."}, {"cat": "monumentos", "q": "Melyik városban van a Colosseum?", "ops": ["Athénban", "Párizsban", "Rómában", "Londonban"], "ok": 2, "dato": "A Colosseum majdnem 2000 éve nyílt meg, és kb. 50 000 ember fért el benne."}, {"cat": "monumentos", "q": "Melyik híres tornyot építették Párizsban 1889-ben?", "ops": ["A pisai ferde tornyot", "Az Eiffel-tornyot", "A Big Bent", "A CN Towert"], "ok": 1, "dato": "Az Eiffel-torony kb. 330 méter magas."}, {"cat": "cultura", "q": "Melyik tenger van Európa és Afrika között?", "ops": ["A Balti-tenger", "Az Északi-tenger", "A Földközi-tenger", "A Vörös-tenger"], "ok": 2, "dato": "A neve azt jelenti: „a földek közötti tenger”."}]}, {"id": "asia", "nombre": "Ázsia", "emoji": "🏯", "color": "#C4532E", "preguntas": [{"cat": "capitales", "q": "Mi Japán fővárosa?", "ops": ["Tokió", "Kiotó", "Oszaka", "Szöul"], "ok": 0, "dato": "Tokió a világ egyik legnagyobb városa."}, {"cat": "capitales", "q": "Melyik ország fővárosa Újdelhi?", "ops": ["Pakisztán", "India", "Nepál", "Banglades"], "ok": 1, "dato": "Indiában élnek a legtöbben a világ összes országa közül."}, {"cat": "idiomas", "q": "Melyik nyelvnek van a legtöbb anyanyelvi beszélője a világon?", "ops": ["Az angolnak", "A spanyolnak", "A hindinek", "A mandarin kínainak"], "ok": 3, "dato": "Közel egymilliárd ember anyanyelve a mandarin kínai."}, {"cat": "agua", "q": "Melyik Ázsia leghosszabb folyója?", "ops": ["A Gangesz", "A Mekong", "A Jangce", "Az Indus"], "ok": 2, "dato": "A Jangce kb. 6300 kilométeren át folyik Kínán keresztül."}, {"cat": "montes", "q": "Melyik hegységben van a Föld legmagasabb csúcsa?", "ops": ["A Himalájában", "Az Andokban", "Az Alpokban", "A Sziklás-hegységben"], "ok": 0, "dato": "A Mount Everest kb. 8850 méter magas."}, {"cat": "monumentos", "q": "Melyik hosszú falat építették, hogy megvédje Kínát a támadásoktól?", "ops": ["Hadrianus falát", "A Kínai nagy falat", "A berlini falat", "A Siratófalat"], "ok": 1, "dato": "A sok szakasza együtt több ezer kilométer hosszú."}, {"cat": "monumentos", "q": "Melyik országban van a Tádzs Mahal?", "ops": ["Iránban", "Törökországban", "Indiában", "Egyiptomban"], "ok": 2, "dato": "Fehér márványból épült síremlék, az 1600-as években készült."}, {"cat": "cultura", "q": "Melyik a Föld legnagyobb kontinense?", "ops": ["Afrika", "Ázsia", "Észak-Amerika", "Európa"], "ok": 1, "dato": "Ázsia a Föld szárazföldjének kb. harmadát borítja."}]}, {"id": "africa", "nombre": "Afrika", "emoji": "🦒", "color": "#C9961A", "preguntas": [{"cat": "capitales", "q": "Mi Egyiptom fővárosa?", "ops": ["Kairó", "Alexandria", "Luxor", "Tunisz"], "ok": 0, "dato": "Kairó Afrika egyik legnagyobb városa."}, {"cat": "capitales", "q": "Melyik ország fővárosa Nairobi?", "ops": ["Etiópia", "Tanzánia", "Kenya", "Uganda"], "ok": 2, "dato": "Nairobiban a város mellett nemzeti park van oroszlánokkal és zsiráfokkal."}, {"cat": "idiomas", "q": "Afrika melyik részén beszélik széles körben a szuahéli nyelvet?", "ops": ["Kelet-Afrikában", "Észak-Afrikában", "Nyugat-Afrikában", "Csak Afrika déli részén"], "ok": 0, "dato": "Kenyában, Tanzániában és a szomszédos országokban emberek milliói beszélnek szuahéliül."}, {"cat": "agua", "q": "Melyik folyó folyik át Egyiptomon a Földközi-tengerbe?", "ops": ["A Kongó", "A Niger", "A Zambézi", "A Nílus"], "ok": 3, "dato": "A Nílus a világ két leghosszabb folyójának egyike."}, {"cat": "montes", "q": "Melyik Afrika legmagasabb hegye?", "ops": ["A Kenya-hegy", "A Kilimandzsáró", "Az Atlasz", "Az Asztal-hegy"], "ok": 1, "dato": "A tanzániai Kilimandzsáró kb. 5900 méter magas, és a csúcsán hó van."}, {"cat": "monumentos", "q": "Hol vannak a nagy piramisok?", "ops": ["Gízában, Egyiptomban", "Timbuktuban, Maliban", "Rómában, Olaszországban", "Petrában, Jordániában"], "ok": 0, "dato": "A nagy piramis kb. 4500 éve épült."}, {"cat": "cultura", "q": "Melyik a világ legnagyobb forró sivataga?", "ops": ["A Góbi", "A Kalahári", "A Szahara", "Az Atacama"], "ok": 2, "dato": "A Szahara Észak-Afrika nagy részét borítja."}, {"cat": "cultura", "q": "Melyik híres vízesés van Zambia és Zimbabwe között?", "ops": ["A Niagara-vízesés", "Az Angel-vízesés", "A Viktória-vízesés", "Az Iguazú-vízesés"], "ok": 2, "dato": "A helyi neve azt jelenti: „mennydörgő füst”."}]}, {"id": "norteamerica", "nombre": "Észak-Amerika", "emoji": "🦅", "color": "#14897B", "preguntas": [{"cat": "capitales", "q": "Mi Kanada fővárosa?", "ops": ["Toronto", "Vancouver", "Montréal", "Ottawa"], "ok": 3, "dato": "Kanada fővárosa Ottawa, nem Toronto."}, {"cat": "capitales", "q": "Mi Mexikó fővárosa?", "ops": ["Cancún", "Mexikóváros", "Guadalajara", "Monterrey"], "ok": 1, "dato": "Mexikóváros az azték Tenochtitlan helyén épült."}, {"cat": "idiomas", "q": "Melyik két nyelv hivatalos Kanadában?", "ops": ["Az angol és a spanyol", "Az angol és a francia", "A francia és a spanyol", "Az angol és a német"], "ok": 1, "dato": "Kanada francia anyanyelvű lakóinak többsége Québecben él."}, {"cat": "agua", "q": "Melyik nagy folyó folyik dél felé az Egyesült Államokon át a Mexikói-öbölbe?", "ops": ["A Mississippi", "Az Amazonas", "A Colorado", "A Hudson"], "ok": 0, "dato": "A Missourival együtt a világ egyik leghosszabb folyórendszerét alkotja."}, {"cat": "montes", "q": "Melyik hegység húzódik Kanada és az Egyesült Államok nyugati részén?", "ops": ["Az Appalache-hegység", "Az Andok", "A Sziklás-hegység", "Az Alpok"], "ok": 2, "dato": "A Sziklás-hegység kb. 4800 kilométer hosszan nyúlik el."}, {"cat": "monumentos", "q": "Melyik óriási kanyont vájta ki a Colorado folyó?", "ops": ["A Grand Canyont", "A Réz-kanyont", "A Halál-völgyet", "A Yosemite-et"], "ok": 0, "dato": "A Grand Canyon helyenként több mint 1,5 kilométer mély."}, {"cat": "monumentos", "q": "Melyik fáklyát tartó szobor áll a New York-i kikötőben?", "ops": ["A Megváltó Krisztus", "A Szabadság-szobor", "A gondolkodó", "A kis hableány"], "ok": 1, "dato": "Franciaország ajándéka volt 1886-ban."}, {"cat": "cultura", "q": "Melyik híres vízesés van Kanada és az Egyesült Államok között?", "ops": ["A Viktória-vízesés", "Az Angel-vízesés", "A Niagara-vízesés", "Az Iguazú-vízesés"], "ok": 2, "dato": "Másodpercenként óriási mennyiségű víz zúdul ott le."}]}, {"id": "sudamerica", "nombre": "Dél-Amerika", "emoji": "🦜", "color": "#3E8E3E", "preguntas": [{"cat": "capitales", "q": "Mi Brazília fővárosa?", "ops": ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"], "ok": 2, "dato": "Brasíliát néhány év alatt építették fel, és 1960-ban lett főváros."}, {"cat": "capitales", "q": "Melyik ország fővárosa Buenos Aires?", "ops": ["Argentína", "Chile", "Uruguay", "Peru"], "ok": 0, "dato": "Buenos Aires a Río de la Plata partján fekszik."}, {"cat": "idiomas", "q": "Milyen nyelven beszélnek Brazíliában?", "ops": ["Spanyolul", "Brazilul", "Portugálul", "Angolul"], "ok": 2, "dato": "Brazíliában él a világon a legtöbb portugál anyanyelvű ember."}, {"cat": "agua", "q": "Melyik folyó szállítja a legtöbb vizet a világon?", "ops": ["A Nílus", "Az Amazonas", "A Paraná", "Az Orinoco"], "ok": 1, "dato": "Az Amazonas több vizet szállít, mint a következő néhány legnagyobb folyó együttvéve."}, {"cat": "montes", "q": "Melyik a szárazföld leghosszabb hegysége?", "ops": ["A Himalája", "A Sziklás-hegység", "Az Andok", "Az Alpok"], "ok": 2, "dato": "Az Andok kb. 7000 kilométer hosszan húzódnak Dél-Amerika nyugati részén."}, {"cat": "monumentos", "q": "Melyik inka város fekszik magasan Peru hegyei között?", "ops": ["Machu Picchu", "Chichén Itzá", "Teotihuacán", "Tikal"], "ok": 0, "dato": "Machu Picchut az 1400-as években építették, és a világ 1911-ben fedezte fel újra."}, {"cat": "monumentos", "q": "Melyik óriási szobor néz le Rio de Janeiróra?", "ops": ["A Szabadság-szobor", "A Megváltó Krisztus", "A Haza hív", "A Kolosszus"], "ok": 1, "dato": "A Corcovado-hegy csúcsán áll."}, {"cat": "cultura", "q": "Melyik a világ legmagasabb vízesése, Venezuelában?", "ops": ["Az Iguazú-vízesés", "A Niagara-vízesés", "Az Angel-vízesés", "A Viktória-vízesés"], "ok": 2, "dato": "Az Angel-vízesés majdnem 1 kilométer magasból zuhan alá."}]}, {"id": "oceania", "nombre": "Óceánia", "emoji": "🦘", "color": "#6B3FA0", "preguntas": [{"cat": "capitales", "q": "Mi Ausztrália fővárosa?", "ops": ["Sydney", "Melbourne", "Canberra", "Perth"], "ok": 2, "dato": "Canberrát fővárosnak építették Sydney és Melbourne között."}, {"cat": "capitales", "q": "Mi Új-Zéland fővárosa?", "ops": ["Auckland", "Wellington", "Christchurch", "Queenstown"], "ok": 1, "dato": "Wellington a világ egyik legszelesebb városa."}, {"cat": "idiomas", "q": "A maori nép melyik nyelve hivatalos Új-Zélandon?", "ops": ["A maori", "A hawaii", "A szamoai", "A tongai"], "ok": 0, "dato": "Új-Zélandon sok helynév a maori nyelvből származik."}, {"cat": "agua", "q": "Melyik a Föld legnagyobb óceánja?", "ops": ["Az Atlanti-óceán", "Az Indiai-óceán", "Az Északi-sarki-óceán", "A Csendes-óceán"], "ok": 3, "dato": "A Csendes-óceán nagyobb, mint a Föld összes szárazföldje együttvéve."}, {"cat": "montes", "q": "Melyik hegység húzódik Ausztrália keleti részén?", "ops": ["A Nagy-Vízválasztó-hegység", "Az Andok", "A Déli-Alpok", "Az Atlasz"], "ok": 0, "dato": "Ez Ausztrália leghosszabb hegysége."}, {"cat": "monumentos", "q": "Melyik híres, fehér „vitorlás” épület van Sydneyben?", "ops": ["Az Operaház", "A Parlament", "A Harbour Bridge", "A Sky Tower"], "ok": 0, "dato": "A Sydney-i Operaház 1973-ban nyílt meg."}, {"cat": "cultura", "q": "Melyik a világ legnagyobb korallzátonya?", "ops": ["A belize-i korallzátony", "A Vörös-tengeri-korallzátony", "A Nagy-korallzátony", "A Maldív-korallzátony"], "ok": 2, "dato": "Az ausztráliai Nagy-korallzátony az űrből is látható."}, {"cat": "cultura", "q": "Melyik állat hordja erszényben a kicsinyét?", "ops": ["A koala és a kenguru", "A pingvin", "Az emu", "A kivi"], "ok": 0, "dato": "Az erszénnyel rendelkező állatokat erszényeseknek hívják. A legtöbbjük Ausztráliában él."}]}]};const U=D.ui;const CL="travel-world-hu";
let est=JSON.parse(localStorage.getItem(CL)||"{}");const guardar=()=>localStorage.setItem(CL,JSON.stringify(est));
const $=s=>document.querySelector(s);const app=$("#app");
const f=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
function pasaporte(){return `<div class="pas"><h2>🛂 ${U.pasaporte}</h2><div class="sellos">${D.continentes.map(c=>`<div class="sello ${est[c.id]?"ok":""}" style="border-color:${c.color};color:${c.color}" title="${c.nombre}">${c.emoji}</div>`).join("")}</div></div>`}
function inicio(){app.innerHTML=`<div style="font-size:54px">🌍✈️</div><h1>${U.titulo.replace(/(\S+)$/,"<span>$1</span>")}</h1><p class="lema">${U.lema}</p>${pasaporte()}<button class="btn" onclick="mapa()">${U.jugar}</button>`}
function mapa(){if(D.continentes.every(c=>est[c.id]))return fin();
 app.innerHTML=`${pasaporte()}<h2 style="margin:6px 0 12px">${U.elige}</h2><div class="mapa">${D.continentes.map((c,i)=>`<button class="cont" style="background:${c.color}" onclick="viaje(${i})"><b>${c.emoji}</b>${c.nombre}${est[c.id]?"<small>✓</small>":""}</button>`).join("")}</div>`}
let cur=null;
function viaje(i){const c=D.continentes[i];cur={c,i:0,bien:0,orden:c.preguntas.map((_,k)=>k).sort(()=>Math.random()-.5)};preg()}
function preg(){const c=cur.c,p=c.preguntas[cur.orden[cur.i]];
 app.innerHTML=`<div class="tarjeta"><span class="cat" style="background:${c.color}">${c.emoji} ${U.categorias[p.cat]}</span><span class="num">${f(U.pregunta,{n:cur.i+1,t:c.preguntas.length})}</span>
 <div class="q">${p.q}</div><div class="ops">${p.ops.map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="acc oculto" id="acc"><button class="btn" onclick="sig()">${U.siguiente} →</button></div></div>`;
 document.querySelectorAll(".op").forEach(b=>b.onclick=()=>resp(+b.dataset.j,p))}
function resp(j,p){document.querySelectorAll(".op").forEach(b=>{b.disabled=true;const k=+b.dataset.j;if(k===p.ok)b.classList.add("bien");else if(k===j)b.classList.add("mal")});
 const ok=j===p.ok;if(ok)cur.bien++;const fb=$("#fb");fb.style.display="block";
 fb.innerHTML=ok?`<b>✅ ${U.correcto}</b>${p.dato}`:`<b>❌ ${U.incorrecto} ${p.ops[p.ok]}</b>${p.dato}`;$("#acc").classList.remove("oculto")}
function sig(){cur.i++;if(cur.i<cur.c.preguntas.length)return preg();
 const c=cur.c,t=c.preguntas.length,gano=cur.bien>=D.aprobar;if(gano){est[c.id]=1;guardar()}
 app.innerHTML=`<div class="tarjeta res"><div class="big">${gano?c.emoji:"🧭"}</div><h2>${gano?U.sello:c.nombre}</h2><p>${f(U.puntos,{n:cur.bien,t})}</p>${gano?"":`<p>${f(U.sello_falta,{n:D.aprobar,t})}</p>`}
 <p>${gano?"":`<button class="btn" onclick="viaje(${D.continentes.indexOf(c)})">${U.reintentar}</button> `}<button class="btn ${gano?"":"gris"}" onclick="mapa()">${U.volver}</button></p></div>`}
function fin(){app.innerHTML=`${pasaporte()}<div class="tarjeta res"><div class="big">🏆</div><h2>${U.final_titulo}</h2><p>${U.final_texto}</p><button class="btn" onclick="est={};guardar();inicio()">${U.reiniciar}</button></div>`}
inicio();
</script></body></html>
